# 切换到 MySQL：启动时加 --spring.profiles.active=mysql
# 建库：CREATE DATABASE mes DEFAULT CHARACTER SET utf8mb4;
# schema.sql / data.sql 会被自动执行（data.sql 用 MERGE，可重复跑）
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mes?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 请改成你的数据库密码
