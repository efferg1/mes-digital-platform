<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>制造业数字化协同平台</title>
<style>
    :root {
        --bg: #f4f6f9;
        --surface: #ffffff;
        --border: #e3e8ef;
        --text: #1b2733;
        --text-sub: #64748b;
        --primary: #1d4ed8;
        --primary-light: #eef3ff;
        --green: #0f7b4f;
        --green-bg: #e8f6ef;
        --amber: #a15c00;
        --amber-bg: #fdf3e3;
        --red: #b42318;
        --red-bg: #fdeceb;
        --grey-bg: #eef1f5;
        --radius: 8px;
        --mono: "Cascadia Mono", Consolas, "Courier New", monospace;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.6;
    }
    header {
        background: #0f2b46;
        color: #fff;
        padding: 18px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
    }
    header h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .3px; }
    header .sub { font-size: 12px; color: #9db4cc; margin-top: 2px; }
    header .stack { font-size: 12px; color: #9db4cc; font-family: var(--mono); }

    main { padding: 20px 28px 40px; max-width: 1440px; margin: 0 auto; }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; }
    .stat .k { font-size: 12px; color: var(--text-sub); }
    .stat .v { font-size: 22px; font-weight: 600; font-family: var(--mono); margin-top: 2px; }

    .grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start; }
    @media (max-width: 1080px) { .grid { grid-template-columns: 1fr; } }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .card-head {
        padding: 12px 16px; border-bottom: 1px solid var(--border);
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .card-head h2 { font-size: 14px; margin: 0; font-weight: 600; }
    .card-head .hint { font-size: 12px; color: var(--text-sub); }
    .card-body { padding: 14px 16px; }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { font-size: 12px; color: var(--text-sub); font-weight: 600; background: #fafbfc; white-space: nowrap; }
    tbody tr:hover { background: #fafcff; cursor: pointer; }
    td.num { font-family: var(--mono); }

    .tag { display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 12px; white-space: nowrap; }
    .t-CREATED { background: var(--grey-bg); color: #475569; }
    .t-RELEASED { background: var(--primary-light); color: var(--primary); }
    .t-IN_PROGRESS { background: var(--amber-bg); color: var(--amber); }
    .t-FINISHED { background: var(--green-bg); color: var(--green); }
    .t-CANCELLED { background: var(--red-bg); color: var(--red); }
    .t-SUCCESS { background: var(--green-bg); color: var(--green); }
    .t-FAILED, .t-PROCESSING { background: var(--red-bg); color: var(--red); }
    .t-PENDING { background: var(--grey-bg); color: #475569; }
    .t-RUNNING { background: var(--amber-bg); color: var(--amber); }
    .t-DONE { background: var(--green-bg); color: var(--green); }

    .bar { width: 78px; height: 6px; background: var(--grey-bg); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
    .bar > i { display: block; height: 100%; background: var(--primary); }

    button {
        font-family: inherit; font-size: 13px; padding: 6px 14px; border-radius: 6px;
        border: 1px solid var(--border); background: #fff; color: var(--text); cursor: pointer;
    }
    button:hover { background: #f7f9fc; }
    button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    button.primary:hover { background: #1740b8; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    .chat-log { max-height: 340px; overflow-y: auto; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 12px; border-radius: 8px; font-size: 13px; }
    .msg.q { background: var(--primary-light); align-self: flex-end; max-width: 92%; }
    .msg.a { background: #f7f9fc; border: 1px solid var(--border); }
    .msg .meta { font-size: 11px; color: var(--text-sub); margin-bottom: 4px; font-family: var(--mono); }
    .msg .src { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 12px; color: var(--text-sub); }
    .msg .src b { color: var(--text); font-weight: 600; }
    .chat-input { display: flex; gap: 8px; }
    .chat-input input {
        flex: 1; padding: 8px 12px; border: 1px solid var(--border);
        border-radius: 6px; font-family: inherit; font-size: 13px;
    }
    .chat-input input:focus { outline: 2px solid var(--primary-light); border-color: var(--primary); }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .chip { font-size: 12px; padding: 3px 10px; border: 1px solid var(--border); border-radius: 20px; cursor: pointer; color: var(--text-sub); }
    .chip:hover { border-color: var(--primary); color: var(--primary); }

    .detail { display: none; margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px; }
    .detail.show { display: block; }
    .kv { display: grid; grid-template-columns: 88px 1fr; gap: 4px 10px; font-size: 13px; margin-bottom: 12px; }
    .kv .k { color: var(--text-sub); }
    .steps { display: flex; gap: 0; margin: 10px 0 14px; flex-wrap: wrap; }
    .step { flex: 1; min-width: 90px; padding: 8px 10px; border: 1px solid var(--border); border-right: none; font-size: 12px; }
    .step:last-child { border-right: 1px solid var(--border); }
    .step.done { background: var(--green-bg); border-color: #bfe3d0; }
    .step.running { background: var(--amber-bg); border-color: #f0d9b0; }
    .step .n { font-weight: 600; }
    .mini { font-size: 12px; color: var(--text-sub); }

    .empty { padding: 22px; text-align: center; color: var(--text-sub); font-size: 13px; }
    .toast {
        position: fixed; right: 24px; bottom: 24px; background: #0f2b46; color: #fff;
        padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0;
        transition: opacity .25s; pointer-events: none; max-width: 420px;
    }
    .toast.show { opacity: 1; }
    .toast.err { background: #8f1d16; }
</style>
</head>
<body>

<header>
    <div>
        <h1>制造业数字化协同平台</h1>
        <div class="sub">工单流转 · 库存联动 · 异构系统集成 · 知识库问答</div>
    </div>
    <div class="stack">Spring Boot 3.2 · Java 17 · JDBC · H2/MySQL</div>
</header>

<main>
    <div class="stats" id="stats"></div>

    <div class="grid">
        <!-- 左：工单 -->
        <section class="card">
            <div class="card-head">
                <h2>生产工单</h2>
                <span class="hint">点击行看详情 · 报工会自动按 BOM 扣料</span>
            </div>
            <div class="card-body" style="padding-top:0">
                <div class="chips" id="statusChips"></div>
                <table>
                    <thead>
                    <tr>
                        <th>工单号</th><th>产品</th><th>进度</th><th>状态</th><th>交期</th><th>来源</th>
                    </tr>
                    </thead>
                    <tbody id="woBody"></tbody>
                </table>
                <div class="detail" id="detail"></div>
            </div>
        </section>

        <!-- 右：AI + 集成 -->
        <div style="display:flex; flex-direction:column; gap:16px">
            <section class="card">
                <div class="card-head">
                    <h2>知识库助手（RAG）</h2>
                    <span class="hint" id="aiMode"></span>
                </div>
                <div class="card-body">
                    <div class="chat-log" id="chatLog">
                        <div class="msg a">
                            <div class="meta">系统</div>
                            知识库里收录了设备操作规程、报工扣料规则、质量异常流程、集成接口说明等 8 篇文档。
                            问点什么试试——答案会附上命中的原文出处，方便核对。
                        </div>
                    </div>
                    <div class="chips">
                        <span class="chip">注塑机液压油温超过 60 度会怎样</span>
                        <span class="chip">报工之后库存是怎么扣的</span>
                        <span class="chip">ERP 重复推送同一个订单会重复建单吗</span>
                    </div>
                    <div class="chat-input">
                        <input id="q" placeholder="问关于工艺、设备、业务流程的问题…" autocomplete="off">
                        <button class="primary" id="askBtn">提问</button>
                    </div>
                </div>
            </section>

            <section class="card">
                <div class="card-head">
                    <h2>集成日志</h2>
                    <span class="hint">ERP / TMS 接入记录</span>
                </div>
                <div class="card-body" style="padding:0">
                    <table>
                        <thead><tr><th>系统</th><th>处理结果</th><th>条数</th></tr></thead>
                        <tbody id="logBody"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>
</main>

<div class="toast" id="toast"></div>

<script>
    const $ = id => document.getElementById(id);
    let currentStatus = '';
    let currentWoId = null;

    function toast(msg, isErr) {
        const t = $('toast');
        t.textContent = msg;
        t.className = 'toast show' + (isErr ? ' err' : '');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.className = 'toast', 3200);
    }

    async function api(path, options) {
        const resp = await fetch(path, Object.assign({
            headers: { 'Content-Type': 'application/json' }
        }, options || {}));
        const data = await resp.json();
        if (!resp.ok || data.code !== 0) {
            throw new Error(data.message || ('HTTP ' + resp.status));
        }
        return data.data;
    }

    // ==================== 看板 ====================
    async function loadSummary() {
        try {
            const d = await api('/api/dashboard/summary');
            const statusMap = {};
            d.workOrderByStatus.forEach(x => statusMap[x.status] = x.cnt);
            const total = Object.values(statusMap).reduce((a, b) => a + b, 0);

            $('stats').innerHTML = [
                ['工单总数', total],
                ['进行中', statusMap['IN_PROGRESS'] || 0],
                ['已下达待产', statusMap['RELEASED'] || 0],
                ['已完工', statusMap['FINISHED'] || 0],
                ['缺料预警', d.belowSafetyStock.length],
            ].map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');

            const logLabel = { SUCCESS: '成功', FAILED: '失败', PROCESSING: '处理中', DUPLICATE: '重复' };
            $('logBody').innerHTML = d.integrationStats.length
                ? d.integrationStats.map(x =>
                    `<tr><td>${x.system}</td>
                         <td><span class="tag t-${x.status}">${logLabel[x.status] || x.status}</span></td>
                         <td class="num">${x.cnt}</td></tr>`).join('')
                : '<tr><td colspan="3" class="empty">还没有外部系统接入记录</td></tr>';
        } catch (e) {
            toast('看板加载失败：' + e.message, true);
        }
    }

    // ==================== 工单列表 ====================
    function statusTag(s) {
        const label = { CREATED: '待下达', RELEASED: '已下达', IN_PROGRESS: '生产中', FINISHED: '已完工', CANCELLED: '已取消' };
        return `<span class="tag t-${s}">${label[s] || s}</span>`;
    }

    async function loadOrders() {
        try {
            const q = currentStatus ? ('?status=' + currentStatus + '&size=20') : '?size=20';
            const page = await api('/api/work-orders' + q);
            if (!page.records.length) {
                $('woBody').innerHTML = '<tr><td colspan="6" class="empty">没有符合条件的工单</td></tr>';
                return;
            }
            $('woBody').innerHTML = page.records.map(w => {
                const pct = w.planQty ? Math.min(100, Math.round(w.doneQty / w.planQty * 100)) : 0;
                return `<tr onclick="showDetail(${w.id})">
                    <td class="num">${w.orderNo}</td>
                    <td>${w.productName || w.productCode}<div class="mini">${w.productCode}</div></td>
                    <td><span class="bar"><i style="width:${pct}%"></i></span>
                        <span class="mini">${w.doneQty}/${w.planQty}</span></td>
                    <td>${statusTag(w.status)}</td>
                    <td class="num mini">${w.dueDate || '-'}</td>
                    <td class="mini">${w.sourceSystem === 'ERP' ? 'ERP 同步' : '手工建单'}</td>
                </tr>`;
            }).join('');
        } catch (e) {
            toast('工单列表加载失败：' + e.message, true);
        }
    }

    // ==================== 详情 ====================
    async function showDetail(id) {
        currentWoId = id;
        try {
            const d = await api('/api/work-orders/' + id);
            const stepHtml = d.steps.map(s => {
                const cls = s.status === 'DONE' ? 'done' : (s.status === 'RUNNING' ? 'running' : '');
                const label = { PENDING: '待开始', RUNNING: '进行中', DONE: '已完成' }[s.status];
                return `<div class="step ${cls}"><div class="n">${s.name}</div>
                        <div class="mini">${label}${s.operator ? ' · ' + s.operator : ''}</div></div>`;
            }).join('');

            const bomHtml = d.bom.map(b =>
                `<div class="mini">· ${b.materialName}（${b.materialCode}）单耗 ${b.qtyPer} ${b.unit}</div>`).join('');

            const canReport = d.status === 'RELEASED' || d.status === 'IN_PROGRESS';
            const canRelease = d.status === 'CREATED';

            $('detail').className = 'detail show';
            $('detail').innerHTML = `
                <div class="kv">
                    <div class="k">工单号</div><div class="num">${d.orderNo}</div>
                    <div class="k">产品</div><div>${d.productName || '-'} · ${d.productCode}</div>
                    <div class="k">数量</div><div class="num">${d.doneQty} / ${d.planQty}（${d.progress}%）</div>
                    <div class="k">来源</div><div>${d.sourceSystem === 'ERP' ? 'ERP 销售订单 ' + (d.sourceOrderNo || '') : '手工建单'}</div>
                    <div class="k">备注</div><div>${d.remark || '-'}</div>
                </div>
                <div class="mini" style="margin-bottom:4px">工艺路线</div>
                <div class="steps">${stepHtml}</div>
                <div class="mini" style="margin-bottom:4px">BOM 单耗</div>
                ${bomHtml}
                <div style="margin-top:14px; display:flex; gap:8px">
                    ${canRelease ? `<button class="primary" onclick="release(${d.id || id})">下达工单</button>` : ''}
                    ${canReport ? `<button class="primary" onclick="report(${id})">报工</button>` : ''}
                    <button onclick="$('detail').className='detail'">收起</button>
                </div>
                ${d.consumedTotal && d.consumedTotal.length
                    ? `<div class="mini" style="margin-top:12px">已耗料 ${d.consumedTotal.length} 条，最近一条：${d.consumedTotal[d.consumedTotal.length - 1].material_name || ''} ${d.consumedTotal[d.consumedTotal.length - 1].delta}</div>`
                    : ''}
            `;
        } catch (e) {
            toast('详情加载失败：' + e.message, true);
        }
    }

    async function release(id) {
        try {
            await api('/api/work-orders/' + id + '/release', { method: 'POST' });
            toast('已下达，第一道工序开工');
            await refresh();
            showDetail(id);
        } catch (e) {
            toast(e.message, true);
        }
    }

    async function report(id) {
        const input = prompt('报工数量（提交后按 BOM 自动扣料）：', '10');
        if (input === null) return;
        const qty = Number(input);
        if (!qty || qty <= 0) { toast('报工数量必须大于 0', true); return; }
        try {
            const r = await api('/api/work-orders/' + id + '/report', {
                method: 'POST',
                body: JSON.stringify({ qty: qty, operator: '车间操作工' })
            });
            toast(`报工成功：累计 ${r.doneQty}/${r.planQty}，扣减 ${r.consumed.length} 种物料`);
            await refresh();
            showDetail(id);
        } catch (e) {
            toast(e.message, true);
        }
    }

    // ==================== AI ====================
    async function loadAiStatus() {
        try {
            const s = await api('/api/ai/status');
            const mode = s.llm.configured ? ('大模型：' + s.llm.model) : '本地检索模式（未配置 API Key）';
            $('aiMode').textContent = s.chunks + ' 个切片 · ' + mode;
        } catch (e) { /* 忽略 */ }
    }

    function appendMsg(cls, html) {
        const div = document.createElement('div');
        div.className = 'msg ' + cls;
        div.innerHTML = html;
        $('chatLog').appendChild(div);
        $('chatLog').scrollTop = $('chatLog').scrollHeight;
    }

    async function ask(text) {
        const q = (text || $('q').value || '').trim();
        if (!q) return;
        $('q').value = '';
        appendMsg('q', `<div class="meta">我</div>${escapeHtml(q)}`);
        const btn = $('askBtn');
        btn.disabled = true;
        btn.textContent = '思考中';
        try {
            const a = await api('/api/ai/ask', {
                method: 'POST',
                body: JSON.stringify({ question: q, topK: 4 })
            });
            const srcHtml = a.sources && a.sources.length
                ? `<div class="src">依据：${a.sources.map(s =>
                    `《<b>${s.docTitle}</b>》第${s.seq}段`).join('、')}</div>`
                : '';
            appendMsg('a',
                `<div class="meta">${a.mode} · ${a.elapsedMs}ms</div>` +
                escapeHtml(a.answer).replace(/\n/g, '<br>') + srcHtml);
        } catch (e) {
            appendMsg('a', `<div class="meta">出错</div>${escapeHtml(e.message)}`);
        } finally {
            btn.disabled = false;
            btn.textContent = '提问';
        }
    }

    function escapeHtml(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // ==================== 初始化 ====================
    const STATUSES = [
        ['', '全部'], ['CREATED', '待下达'], ['RELEASED', '已下达'],
        ['IN_PROGRESS', '生产中'], ['FINISHED', '已完工']
    ];

    function renderChips() {
        $('statusChips').innerHTML = STATUSES.map(([v, label]) =>
            `<span class="chip" data-s="${v}" style="${v === currentStatus ? 'border-color:#1d4ed8;color:#1d4ed8' : ''}"
                   onclick="switchStatus('${v}')">${label}</span>`).join('');
    }

    function switchStatus(s) {
        currentStatus = s;
        renderChips();
        loadOrders();
    }

    async function refresh() {
        await Promise.all([loadSummary(), loadOrders()]);
    }

    $('askBtn').onclick = () => ask();
    $('q').addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
    document.querySelectorAll('.chip[data-s], .chips .chip:not([data-s])').forEach(c => {
        if (!c.dataset.s) c.onclick = () => ask(c.textContent);
    });

    renderChips();
    refresh();
    loadAiStatus();

    // 支持用 #问题 直接打开并自动提问，方便截图与分享演示
    const autoQuestion = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    if (autoQuestion) {
        setTimeout(() => ask(autoQuestion), 400);
    }
</script>
</body>
</html>
